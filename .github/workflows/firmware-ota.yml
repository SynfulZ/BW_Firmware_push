name: Firmware Build & OTA

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  BUILD_TARGET: 8850CM_V1.1_MC661-IN-29-10-JIO
  MQTT_BROKER: broker.hivemq.com
  MQTT_PORT: 1883
  MQTT_TOPIC: /bw/mqtt/ota/864071082007457
  OTA_SEVERITY: critical

jobs:
  build-and-flash:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build firmware
        shell: cmd
        run: |
          call tools\launch.bat 8850CM_V1.1_MC661-IN-29-10-JIO debug gcc-arm-none-eabi-10.2.1
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          set BUILD_TARGET=8850CM_V1.1_MC661-IN-29-10-JIO
          cd out\8850CM_V1.1_MC661-IN-29-10-JIO_debug
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          cmake ../.. -G Ninja
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          ninja
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Compute SHA256 and version
        id: meta
        shell: pwsh
        run: |
          $img = Get-ChildItem -Path "out\${{ env.BUILD_TARGET }}_debug" -Filter "*.img" -Recurse |
                 Sort-Object LastWriteTime -Descending |
                 Select-Object -First 1
          if (-not $img) { throw "No .img file found after build" }
          $sha     = (Get-FileHash $img.FullName -Algorithm SHA256).Hash.ToLower()
          $version = git describe --tags --always --dirty
          $fname   = $img.Name
          echo "sha=$sha"                  >> $env:GITHUB_OUTPUT
          echo "version=$version"          >> $env:GITHUB_OUTPUT
          echo "img_path=$($img.FullName)" >> $env:GITHUB_OUTPUT
          echo "img_name=$fname"           >> $env:GITHUB_OUTPUT
          Write-Host "IMG    : $($img.FullName)"
          Write-Host "SHA256 : $sha"
          Write-Host "Version: $version"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Firmware ${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.img_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── jsDelivr CDN URL — free, global, no setup needed ──────────────────
      - name: Resolve jsDelivr CDN URL
        id: url
        shell: pwsh
        run: |
          $repo  = "${{ github.repository }}"
          $ver   = "${{ steps.meta.outputs.version }}"
          $fname = "${{ steps.meta.outputs.img_name }}"
          $url   = "https://cdn.jsdelivr.net/gh/$repo@$ver/out/${{ env.BUILD_TARGET }}_debug/$fname"
          echo "firmware_url=$url" >> $env:GITHUB_OUTPUT
          Write-Host "jsDelivr URL: $url"

      - name: Install paho-mqtt
        run: pip install paho-mqtt

      - name: Publish OTA via MQTT
        shell: pwsh
        env:
          OTA_VERSION: ${{ steps.meta.outputs.version }}
          OTA_URL: ${{ steps.url.outputs.firmware_url }}
          OTA_SEVERITY: ${{ env.OTA_SEVERITY }}
          OTA_SHA: ${{ steps.meta.outputs.sha }}
          MQTT_BROKER: ${{ env.MQTT_BROKER }}
          MQTT_PORT: ${{ env.MQTT_PORT }}
          MQTT_TOPIC: ${{ env.MQTT_TOPIC }}
        run: python scripts/publish_ota.py
